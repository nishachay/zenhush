name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-x11-0
      - name: Run tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/zenhush.exe dist/zenhush-windows-x86_64.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp target/release/zenhush dist/zenhush-macos
          else
            cp target/release/zenhush dist/zenhush-linux-x86_64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zenhush-${{ matrix.os }}
          path: dist/
