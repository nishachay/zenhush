[package]
name = "zenhush"
version = "2.0.0"
edition = "2021"
description = "Zenhush — lightweight top-bar & notch focus audio machine (live stereo soundscapes, atmosphere layering, locked local tracks)"
license = "MIT"

[[bin]]
name = "zenhush"
path = "src/main.rs"

[dependencies]
# Audio output (cross-platform: ALSA/PipeWire/PulseAudio, WASAPI, CoreAudio)
cpal = "0.18"
# Immediate-mode UI (glow backend only — avoids heavy wgpu/Vulkan RAM overhead)
eframe = { version = "0.32", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.32"
# File decoding: wav, mp3, flac, ogg, m4a
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "isomp4", "aac"] }
# Random numbers for procedural noise & textures
rand = "0.9"
# Lock-free ring buffers (decoder -> audio callback -> UI visualizer)
rtrb = "0.3"
# Settings & local track library persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Native file picker
rfd = "0.15"
# PNG decoding/encoding for icons and dynamic tray icon badges
image = { version = "0.25", default-features = false, features = ["png"] }
# Lucide SVG icon rasterizer
resvg = { version = "0.50", default-features = false }
# Cross-platform global hotkeys (X11, macOS, Windows; Wayland uses IPC + portal/gsettings)
global-hotkey = "0.10"

# Linux system tray (pure Rust D-Bus StatusNotifier, zero GTK dependency) + MPRIS2 D-Bus
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

# macOS & Windows native system tray / menu bar
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.27", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["NSApplication", "NSRunningApplication"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
